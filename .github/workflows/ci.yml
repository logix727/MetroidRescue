name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet test MetroidRescue.Tests/MetroidRescue.Tests.csproj -c Release

  publish:
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, win-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish ${{ matrix.runtime }}
        run: >-
          dotnet publish MetroidRescue.Avalonia/MetroidRescue.Avalonia.csproj
          -c Release -r ${{ matrix.runtime }} --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o artifacts/${{ matrix.runtime }}
      - name: Smoke test bundled Linux tools
        if: matrix.runtime == 'linux-x64'
        shell: bash
        run: |
          chmod +x artifacts/linux-x64/Tools/linux-x64/{adb,fastboot,payload-dumper-go}
          artifacts/linux-x64/Tools/linux-x64/adb version
          artifacts/linux-x64/Tools/linux-x64/fastboot --version
          artifacts/linux-x64/Tools/linux-x64/payload-dumper-go -h >/dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: MetroidRescue-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}
          if-no-files-found: error
