name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test MetroidRescue.Tests/MetroidRescue.Tests.csproj -c Release
      - name: Publish Windows and Linux
        shell: bash
        run: |
          set -euo pipefail
          project=MetroidRescue.Avalonia/MetroidRescue.Avalonia.csproj
          for runtime in win-x64 linux-x64; do
            dotnet publish "$project" -c Release -r "$runtime" --self-contained true \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -o "dist/$runtime"
          done
          cp MetroidRescue.Avalonia/README.md MetroidRescue.Avalonia/RELEASE_BLOCKERS.md dist/win-x64/
          cp MetroidRescue.Avalonia/README.md MetroidRescue.Avalonia/LINUX.md \
            MetroidRescue.Avalonia/RELEASE_BLOCKERS.md MetroidRescue.Avalonia/run-metroid-rescue.sh dist/linux-x64/
          chmod +x dist/linux-x64/MetroidRescue dist/linux-x64/run-metroid-rescue.sh \
            dist/linux-x64/Tools/linux-x64/adb dist/linux-x64/Tools/linux-x64/fastboot \
            dist/linux-x64/Tools/linux-x64/payload-dumper-go
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd dist
          find linux-x64 win-x64 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -r "MetroidRescue-${tag}.zip" linux-x64 win-x64 SHA256SUMS
          sha256sum "MetroidRescue-${tag}.zip" > "MetroidRescue-${tag}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/MetroidRescue-${GITHUB_REF_NAME}.zip"
          "dist/MetroidRescue-${GITHUB_REF_NAME}.zip.sha256"
          --title "Metroid Rescue ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
